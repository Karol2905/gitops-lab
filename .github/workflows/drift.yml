name: drift

on:
  schedule:
    - cron: "0 11 * * *"     # todos los días a las 06:00 hora de Bogotá
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VAR_location: ${{ vars.GCP_LOCATION }}
  TF_VAR_owner: ${{ github.repository_owner }}

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      TF_VAR_project_id: ${{ matrix.env == 'prod' && vars.GCP_PROJECT_PROD || vars.GCP_PROJECT_DEV }}
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v5
      - name: Autenticarse en GCP (OIDC + Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"
      - name: Plan (detecta deriva)
        id: plan
        continue-on-error: true
        run: >
          terraform plan -no-color -input=false
          -detailed-exitcode -lock-timeout=120s
      - name: Abrir un issue si hay deriva
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v8
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          ENTORNO: ${{ matrix.env }}
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Deriva detectada en ${process.env.ENTORNO}`,
              body: "La infraestructura real difiere de lo declarado en Git.\n\n" +
                "```\n" + process.env.PLAN.slice(-60000) + "\n```"
            });
      - name: Fallar si el plan tuvo un error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
